<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: Arial, sans-serif;
      }
      #unity-container {
        position: absolute;
        inset: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #000;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        bottom: 36px;
        width: min(420px, 84vw);
        transform: translateX(-50%);
        display: none;
      }
      #unity-progress-bar-empty {
        width: 100%;
        height: 14px;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #2ecc71, #4aa3ff);
      }
      #unity-warning {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 12px;
        z-index: 10;
      }
      #unity-fullscreen-button {
        position: absolute;
        right: 12px;
        bottom: 12px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        cursor: pointer;
        border-radius: 4px;
        user-select: none;
      }
    </style>
    <script>
      const BUILD_VER = Date.now();
      function withVer(path) {
        return path + "?v=" + BUILD_VER;
      }
    </script>
    <script src="wasm_no_streaming_patch.js"></script>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-fullscreen-button">Fullscreen</div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(message, type) {
        var div = document.createElement("div");
        div.innerHTML = message;
        div.style.padding = "8px";
        div.style.marginTop = "6px";
        div.style.borderRadius = "4px";
        div.style.background = (type === "error") ? "rgba(176, 40, 40, 0.92)" : "rgba(199, 140, 17, 0.92)";
        warningBanner.appendChild(div);
        if (type !== "error") {
          setTimeout(function () {
            warningBanner.removeChild(div);
          }, 5000);
        }
      }

      var buildUrl = "Build";
      var config = {
        dataUrl: withVer(buildUrl + "/{{{ DATA_FILENAME }}}"),
        frameworkUrl: withVer(buildUrl + "/{{{ FRAMEWORK_FILENAME }}}"),
        codeUrl: withVer(buildUrl + "/{{{ CODE_FILENAME }}}"),
#if MEMORY_FILENAME
        memoryUrl: withVer(buildUrl + "/{{{ MEMORY_FILENAME }}}"),
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: withVer(buildUrl + "/{{{ SYMBOLS_FILENAME }}}"),
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content = "width=device-width,height=device-height,initial-scale=1.0,user-scalable=no,shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = withVer(buildUrl + "/{{{ LOADER_FILENAME }}}");
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
